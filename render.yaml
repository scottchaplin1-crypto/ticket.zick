databases:
  - name: ticket-zick-db
    plan: free

services:
  # Backend API — stores all config, talks to Discord on the bot's behalf, serves the dashboard's data
  - type: web
    name: ticket-zick-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-zick-db
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        sync: false

  # Discord bot — a background worker, no public URL, stays connected to Discord
  - type: worker
    name: ticket-zick-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: API_URL
        sync: false

  # Web dashboard — static React build
  - type: web
    name: ticket-zick-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
      - key: VITE_DISCORD_REDIRECT_URI
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
